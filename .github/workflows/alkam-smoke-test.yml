name: IstasyonALKAM Bot Preview Test

on:
  push:
    branches:
      - main
      - safe-bank-import-v1
      - luca-sync
      - luca-fix
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      test_url:
        description: 'Test edilecek ALKAM linki'
        required: false
        default: 'https://alkam-mali.pages.dev/'

jobs:
  istasyonalkam-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run İstasyON v13 static safety check
        run: node tools/verify-istasyon-v13-static.mjs

      - name: Wait for Cloudflare Pages deploy
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        env:
          ALKAM_TEST_URL: ${{ github.event.inputs.test_url || 'https://alkam-mali.pages.dev/' }}
        run: |
          set -euo pipefail
          base="${ALKAM_TEST_URL%/}"
          for i in $(seq 1 40); do
            html="$(curl -fsSL --max-time 15 "$base/" 2>/dev/null || true)"
            js="$(curl -fsSL --max-time 15 "$base/istasyon-v13-readiness.js?v=13" 2>/dev/null || true)"
            if printf '%s' "$html" | grep -q 'istasyon-v13-readiness.js?v=13' \
              && printf '%s' "$js" | grep -q 'EXPECTED_ACTIVE=73' \
              && printf '%s' "$js" | grep -q 'EXPECTED_OPENING=3741583.88'; then
              echo "ISTASYON_V13_DEPLOY_READY attempt=$i"
              exit 0
            fi
            echo "Waiting for Pages deploy... attempt=$i"
            sleep 10
          done
          echo "Cloudflare Pages did not expose the merged v13 assets in time."
          exit 1

      - name: Install Playwright
        if: github.event_name != 'pull_request'
        run: |
          npm init -y
          npm install -D playwright
          npx playwright install --with-deps chromium

      - name: Run IstasyonALKAM bank check
        if: github.event_name != 'pull_request'
        env:
          ALKAM_TEST_URL: ${{ github.event.inputs.test_url || 'https://alkam-mali.pages.dev/' }}
        run: node tools/istasyonalkam-bank-check.mjs

      - name: Run IstasyonALKAM operation check
        if: github.event_name != 'pull_request'
        env:
          ALKAM_TEST_URL: ${{ github.event.inputs.test_url || 'https://alkam-mali.pages.dev/' }}
        run: node tools/istasyonalkam-operation-check.mjs

      - name: Run IstasyonALKAM sample flow
        if: github.event_name != 'pull_request'
        env:
          ALKAM_TEST_URL: ${{ github.event.inputs.test_url || 'https://alkam-mali.pages.dev/' }}
        run: node tools/istasyonalkam-operation-flow-check.mjs

      - name: Run IstasyonALKAM mobile cari check
        if: github.event_name != 'pull_request'
        env:
          ALKAM_TEST_URL: ${{ github.event.inputs.test_url || 'https://alkam-mali.pages.dev/' }}
        run: node tools/istasyonalkam-mobile-cari-check.mjs

      - name: Run IstasyonALKAM Telegram check
        if: github.event_name != 'pull_request'
        env:
          ALKAM_TEST_URL: ${{ github.event.inputs.test_url || 'https://alkam-mali.pages.dev/' }}
        run: node tools/istasyonalkam-telegram-check.mjs

      - name: Run ALKAM live visual check
        if: github.event_name != 'pull_request'
        env:
          ALKAM_TEST_URL: ${{ github.event.inputs.test_url || 'https://alkam-mali.pages.dev/' }}
        run: node tools/alkam-live-visual-check.mjs

      - name: Run IstasyonALKAM automation check
        if: github.event_name != 'pull_request'
        env:
          ALKAM_TEST_URL: ${{ github.event.inputs.test_url || 'https://alkam-mali.pages.dev/' }}
        run: node tools/istasyonalkam-automation-check.mjs

      - name: Run IstasyonALKAM Luca sync check
        if: github.event_name != 'pull_request' && (github.ref_name == 'luca-sync' || github.ref_name == 'luca-fix')
        env:
          ALKAM_TEST_URL: ${{ github.event.inputs.test_url || 'https://luca-fix.alkam-mali.pages.dev/' }}
        run: node tools/istasyonalkam-luca-sync-check.mjs

      - name: Upload bot output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: istasyonalkam-bot-output
          path: test-output
